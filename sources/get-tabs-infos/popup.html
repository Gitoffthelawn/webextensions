<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Get Tabs Infos</title>
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="popup">
    <section>
      <label for="formatOptions">Format</label>
      <div class="row">
        <select id="formatOptions">
          <option value="">Select a format</option>
        </select>
        <button
          id="btnDeleteFormat"
          class="icon danger"
          title="Delete selected format"
          aria-label="Delete selected format"
        >
          🗑
        </button>
      </div>
      <details id="addFormat">
        <summary>Add a format</summary>
        <div class="row">
          <input
            id="newEntry"
            type="text"
            placeholder="e.g. [%title](%url)"
            aria-label="New format"
          />
          <button id="btnAddFormat">Add</button>
        </div>
        <div
          class="chips"
          id="placeholders"
          aria-label="Insert placeholder"
        ></div>
      </details>
    </section>

    <section class="scope">
      <fieldset>
        <legend>Tabs</legend>
        <div class="segmented">
          <label
            ><input type="radio" name="which" value="All" checked /><span
              >All</span
            ></label
          >
          <label
            ><input type="radio" name="which" value="Selected" /><span
              >Selected</span
            ></label
          >
        </div>
      </fieldset>
      <fieldset>
        <legend>Windows</legend>
        <div class="segmented">
          <label
            ><input type="radio" name="win" value="current" checked /><span
              >Current</span
            ></label
          >
          <label
            ><input type="radio" name="win" value="all" /><span
              >All</span
            ></label
          >
        </div>
      </fieldset>
    </section>

    <section>
      <div class="output-head">
        <label for="output">Result</label>
        <span class="meta" id="count"></span>
      </div>
      <textarea
        id="output"
        wrap="off"
        placeholder="Choose a format and the result appears here."
      ></textarea>
      <div class="actions">
        <button id="btnCopyAsText" class="primary">Copy as text</button>
        <button id="btnCopyAsHTML">Copy as HTML</button>
      </div>
      <div class="row save-row">
        <input
          id="saveFilename"
          type="text"
          placeholder="File name (default: date and time)"
          aria-label="File name"
        />
        <button id="btnSaveToFile">Save as file</button>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
    </section>

    <script src="utils.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
