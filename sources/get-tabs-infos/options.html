<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Get Tabs Infos - Preferences</title>
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="options">
    <header>
      <h1>Shortcut actions</h1>
      <p>
        Each shortcut applies one format to one set of tabs, then copies or
        saves the result. Changes are saved automatically.
      </p>
      <button id="btnShortcuts">Set shortcut keys</button>
      <span class="meta" id="status" role="status" aria-live="polite"></span>
    </header>

    <table id="shortcutconfigs">
      <thead>
        <tr>
          <th scope="col">Shortcut</th>
          <th scope="col">Format</th>
          <th scope="col">Tabs and windows</th>
          <th scope="col">Action</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>

    <script src="utils.js"></script>
    <script src="options.js"></script>
  </body>
</html>
