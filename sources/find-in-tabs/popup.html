<!doctype html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <template id="li_template">
    <li class="tab-result">
      <a>
        <div class="tab-result__head">
          <img class="favicon" alt="" />
          <h4 class="title"></h4>
        </div>
        <p class="result"></p>
      </a>
    </li>
  </template>

  <fieldset id="fsinput">
    <div class="search-row">
      <svg
        class="search-icon"
        viewBox="0 0 24 24"
        fill="none"
        aria-hidden="true"
      >
        <circle
          cx="11"
          cy="11"
          r="6.5"
          stroke="currentColor"
          stroke-width="1.6"
        />
        <path
          d="M20 20L16 16"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
        />
      </svg>
      <input
        id="searchField"
        type="search"
        placeholder="Search open tabs"
        autofocus
      />
    </div>

    <div class="options-row">
      <label class="opt opt-number" title="Max results per tab">
        <span>Max</span>
        <input id="maxhits" type="number" min="1" />
      </label>
      <label class="opt opt-toggle" title="Match case">
        <input id="caseSensitive" type="checkbox" />
        <span>Aa</span>
      </label>
      <label class="opt opt-toggle" title="Match diacritics">
        <input id="accentSensitive" type="checkbox" />
        <span>áâã</span>
      </label>
      <label class="opt opt-toggle" title="Regex mode">
        <input id="regexmode" type="checkbox" />
        <span>.*</span>
      </label>
    </div>

    <progress id="searchprogress" value="0" max="1"></progress>
    <div id="note"></div>
  </fieldset>

  <ul id="resultlist"></ul>

  <script src="popup.js"></script>
</body>
