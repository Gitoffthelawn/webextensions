<!doctype html>
<head>
  <meta content="text/html;charset=utf-8" />
  <style>
    :root {
      --bg: #0e2b34;
      --surface: #133846;
      --border: #2a5c6d;
      --text: #eaf4f2;
      --text-muted: #93b6bb;
      --accent: #e2583f;
      --accent-2: #f0a83c;
    }
    * {
      box-sizing: border-box;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      padding: 20px;
      max-width: 700px;
      margin: 0 auto;
    }
    h3 {
      font-weight: 600;
      margin-bottom: 4px;
    }
    p.hint {
      color: var(--text-muted);
      margin-top: 0;
      font-size: 13px;
    }
    #styles {
      width: 100%;
      height: 45em;
      background-color: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      line-height: 1.5;
      resize: vertical;
    }
    #styles:focus-visible {
      outline: 2px solid var(--accent-2);
      outline-offset: 1px;
    }
    #reset {
      display: block;
      margin: 14px auto 0;
      width: 50%;
      padding: 8px;
      background-color: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
    }
    #reset:hover {
      filter: brightness(1.1);
    }
  </style>
</head>
<body>
  <h3>Popup stylesheet</h3>
  <p class="hint">
    This CSS controls the look of the toolbar popup. Edit it directly, or reset
    to the built-in theme.
  </p>
  <textarea
    autocomplete="off"
    autocorrect="off"
    autocapitalize="off"
    spellcheck="false"
    id="styles"
  ></textarea>
  <button id="reset">Reset to default</button>
  <script src="options.js"></script>
</body>
