<!doctype html>
<head>
  <title>working ...</title>
  <meta content="text/html;charset=utf-8" http-equiv="Content-Type" />
  <style>
    :root {
      --bg: #fafaf9;
      --surface: #ffffff;
      --border: #e1dfdc;
      --text: #211f1d;
      --muted: #6b6863;
      --accent: #e86a2c;
      --type-xml: #3d7a56;
      --type-xml-bg: #e8f2ec;
      --type-json: #33587f;
      --type-json-bg: #e8eef4;
      --font-ui:
        -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --font-code:
        ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", Menlo,
        monospace;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 28px 24px 40px;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-ui);
      font-size: 14px;
      line-height: 1.5;
    }

    .page {
      max-width: 760px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 18px;
    }

    header h1 {
      font-size: 17px;
      font-weight: 600;
      margin: 0 0 4px;
    }

    header p {
      margin: 0;
      color: var(--muted);
      font-family: var(--font-code);
      font-size: 12px;
      word-break: break-all;
    }

    progress {
      width: 100%;
      height: 6px;
      border: none;
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 20px;
      accent-color: var(--accent);
    }

    progress::-webkit-progress-bar {
      background: var(--border);
      border-radius: 3px;
    }

    progress::-webkit-progress-value {
      background: var(--accent);
      border-radius: 3px;
    }

    ul#feedlist {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    ul#feedlist li {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
    }

    .type-badge {
      flex-shrink: 0;
      font-family: var(--font-code);
      font-size: 11px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 4px;
    }

    .type-badge.xml {
      color: var(--type-xml);
      background: var(--type-xml-bg);
    }

    .type-badge.json {
      color: var(--type-json);
      background: var(--type-json-bg);
    }

    .feed-link {
      flex: 1;
      min-width: 0;
      font-family: var(--font-code);
      font-size: 13px;
      color: var(--text);
      text-decoration: none;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .feed-link:hover {
      color: var(--accent);
      text-decoration: underline;
    }

    .copy-btn {
      flex-shrink: 0;
      font-family: var(--font-ui);
      font-size: 12px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--muted);
      border-radius: 5px;
      padding: 4px 9px;
      cursor: pointer;
    }

    .copy-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .empty-state {
      color: var(--muted);
      padding: 24px 0;
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <h1 id="msg">Looking for feed-like URLs, please wait</h1>
      <p id="target"></p>
    </header>
    <progress id="urls2checkProgress" value="0" max="1"></progress>
    <ul id="feedlist"></ul>
  </div>
  <script src="find.js"></script>
</body>
