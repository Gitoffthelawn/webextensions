<!doctype html>
<head>
  <meta charset="utf-8" />
  <title>Find Feeds — Detector Rules</title>
  <style>
    :root {
      --bg: #fafaf9;
      --surface: #ffffff;
      --border: #e1dfdc;
      --text: #211f1d;
      --muted: #6b6863;
      --accent: #e86a2c;
      --accent-ink: #ffffff;
      --danger: #ae3b27;
      --danger-bg: #fbebe7;
      --focus: #e86a2c;
      --font-ui:
        -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --font-code:
        ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", Menlo,
        monospace;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 32px 24px 96px;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-ui);
      font-size: 14px;
      line-height: 1.5;
    }

    .page {
      max-width: 860px;
      margin: 0 auto;
    }

    header.topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 28px;
    }

    header.topbar h1 {
      font-size: 20px;
      font-weight: 600;
      margin: 0 0 4px;
    }

    header.topbar p {
      margin: 0;
      color: var(--muted);
      max-width: 52ch;
    }

    .topbar-actions {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    button {
      font-family: var(--font-ui);
      font-size: 13px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      padding: 7px 14px;
      cursor: pointer;
    }

    button:hover {
      border-color: var(--muted);
    }

    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 1px;
    }

    button.btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-ink);
      font-weight: 600;
    }

    button.btn-primary:hover {
      filter: brightness(1.05);
    }

    button.btn-danger-text {
      border: none;
      background: transparent;
      color: var(--muted);
      padding: 4px 8px;
    }

    button.btn-danger-text:hover {
      color: var(--danger);
      background: var(--danger-bg);
    }

    .rules {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .rule-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 16px;
    }

    .rule-card.is-new {
      border-style: dashed;
      background: transparent;
    }

    .rule-head {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .rule-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
      flex-shrink: 0;
    }

    .rule-toggle input {
      accent-color: var(--accent);
    }

    .rule-label {
      font-size: 12px;
      color: var(--muted);
      flex-shrink: 0;
    }

    input.url_regex {
      flex: 1;
      min-width: 0;
      font-family: var(--font-code);
      font-size: 13px;
      padding: 6px 8px;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: var(--bg);
      color: var(--text);
    }

    input.url_regex.is-invalid {
      border-color: var(--danger);
      background: var(--danger-bg);
    }

    textarea.code {
      width: 100%;
      font-family: var(--font-code);
      font-size: 13px;
      line-height: 1.5;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: var(--bg);
      color: var(--text);
      resize: vertical;
      min-height: 2.4em;
      max-height: 2.4em;
      overflow: hidden;
      transition: max-height 0.15s ease;
    }

    textarea.code:focus {
      max-height: 60vh;
      overflow: auto;
    }

    .rule-card.is-new textarea.code,
    .rule-card.is-new input.url_regex {
      background: var(--surface);
    }

    .formbar {
      position: sticky;
      bottom: 0;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 20px;
      padding: 14px 0;
      background: linear-gradient(to top, var(--bg) 60%, transparent);
    }

    .save-status {
      font-size: 13px;
      color: var(--muted);
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .save-status.is-visible {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div>
        <h1>Detector rules</h1>
        <p>
          Each rule matches a page URL with a regex, then runs the JS code
          against that page to return candidate feed URLs.
        </p>
      </div>
      <div class="topbar-actions">
        <button id="expbtn" type="button">Export</button>
        <button id="impbtn_wrapper" type="button">Import</button>
        <input id="impbtn" type="file" style="display: none" />
      </div>
    </header>
    <form id="mainForm" accept-charset="utf-8">
      <div id="mainTableBody" class="rules"></div>
      <div class="formbar">
        <button type="submit" class="btn-primary">Save changes</button>
        <span id="saveStatus" class="save-status" aria-live="polite"
          >Saved</span
        >
      </div>
    </form>
  </div>
  <script src="options.js"></script>
</body>
