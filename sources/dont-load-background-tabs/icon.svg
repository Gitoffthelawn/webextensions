<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Dont Load Background Tabs</title>
  <!-- browser tab: header + page body -->
  <rect x="8" y="12" width="40" height="24" rx="9" fill="#5b6ee1"/>
  <rect x="8" y="24" width="80" height="62" rx="11" fill="#5b6ee1"/>
  <!-- inner page area for contrast -->
  <rect x="14" y="30" width="68" height="50" rx="7" fill="#3f4fbf"/>
  <!-- pause bars: "held until activated" -->
  <rect x="33" y="40" width="11" height="30" rx="3" fill="#ffffff"/>
  <rect x="52" y="40" width="11" height="30" rx="3" fill="#ffffff"/>
</svg>
