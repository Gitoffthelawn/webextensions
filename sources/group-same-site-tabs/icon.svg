<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Group Same Site Tabs</title>
  <!-- group container -->
  <rect x="4" y="11" width="40" height="31" rx="7" fill="#2563eb" fill-opacity="0.16" stroke="#2563eb" stroke-width="3"/>
  <!-- group label pill -->
  <rect x="8" y="4" width="20" height="10" rx="5" fill="#2563eb"/>
  <!-- tabs inside the group -->
  <rect x="9" y="21" width="13" height="16" rx="3" fill="#2563eb"/>
  <rect x="26" y="21" width="13" height="16" rx="3" fill="#2563eb" fill-opacity="0.55"/>
  <!-- tab header strips -->
  <rect x="11.5" y="24" width="8" height="2.5" rx="1.25" fill="#ffffff"/>
  <rect x="28.5" y="24" width="8" height="2.5" rx="1.25" fill="#ffffff" fill-opacity="0.9"/>
</svg>
