<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Export Bookmarks as Text</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        flex-direction: column;
        font-family: system-ui, sans-serif;
      }
      header {
        display: flex;
        gap: 0.5em;
        align-items: center;
        padding: 0.4em 0.6em;
        border-bottom: 1px solid GrayText;
      }
      #edited {
        margin-left: auto;
        color: #d97706;
        font-weight: 600;
      }
      #edited + #count {
        margin-left: 0.8em;
      }
      header span {
        margin-left: auto;
        opacity: 0.7;
        font-size: 0.9em;
      }
      textarea.wrap {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      textarea {
        flex: 1;
        width: 100%;
        box-sizing: border-box;
        border: none;
        margin: 0;
        padding: 0.5em;
        white-space: pre;
        outline: none;
        overflow: auto;
        resize: none;
        font-family: ui-monospace, monospace;
      }
    </style>
  </head>
  <body>
    <header>
      <label
        >Format
        <select id="format">
          <option value="text">Indented text</option>
          <option value="markdown">Markdown</option>
          <option value="urls">URLs only</option>
        </select>
      </label>
      <label><input type="checkbox" id="wrap" /> Wrap text</label>
      <label
        ><input type="checkbox" id="empty" autocomplete="off" /> Include empty
        folders</label
      >
      <button id="refresh">Refresh</button>
      <button id="copy">Copy</button>
      <button id="download">Download</button>
      <span id="edited" hidden>● Edited</span>
      <span id="count"></span>
    </header>
    <textarea autocomplete="off" spellcheck="false" id="output">
loading, please wait</textarea
    >
    <script src="export.js"></script>
  </body>
</html>
