<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" href="icon.png" />
    <title>Copy Video Frame - Options</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        max-width: 460px;
        margin: 1.5em auto;
        padding: 0 1em;
        color: #222;
      }
      header {
        display: flex;
        align-items: center;
        gap: 0.6em;
        margin-bottom: 1.2em;
      }
      header img {
        width: 32px;
        height: 32px;
      }
      header h1 {
        font-size: 1.15em;
        margin: 0;
      }
      fieldset {
        border: 1px solid rgba(127, 127, 127, 0.35);
        border-radius: 8px;
        margin: 0 0 1em;
        padding: 0.9em 1.1em 1.1em;
      }
      legend {
        font-weight: 600;
        padding: 0 0.4em;
      }
      .switch-row {
        display: flex;
        align-items: center;
        gap: 0.6em;
        margin-bottom: 0.9em;
      }
      .switch-row label {
        cursor: pointer;
      }
      .sound-info {
        display: flex;
        align-items: center;
        gap: 0.5em;
        margin-bottom: 0.7em;
        font-size: 0.92em;
      }
      .sound-info .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #999;
        flex-shrink: 0;
      }
      .sound-info.custom .dot {
        background: #2a7d2a;
      }
      #currentSound {
        font-weight: 600;
      }
      .actions {
        display: flex;
        gap: 0.5em;
        flex-wrap: wrap;
        margin-bottom: 0.6em;
      }
      button {
        cursor: pointer;
        border: 1px solid rgba(127, 127, 127, 0.4);
        background: rgba(127, 127, 127, 0.08);
        border-radius: 6px;
        padding: 0.4em 0.8em;
        font-size: 0.92em;
        color: inherit;
      }
      button:hover {
        background: rgba(127, 127, 127, 0.18);
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .hint {
        font-size: 0.82em;
        color: #777;
        margin: 0;
      }
      #status {
        min-height: 1.2em;
        font-size: 0.88em;
        margin-top: 0.4em;
      }
      #status.ok {
        color: #2a7d2a;
      }
      #status.error {
        color: #c0392b;
      }
      @media (prefers-color-scheme: dark) {
        body {
          color: #eee;
        }
        .hint {
          color: #aaa;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <img src="icon.png" alt="" />
      <h1>Copy Video Frame</h1>
    </header>

    <fieldset>
      <legend>Shutter sound</legend>

      <div class="switch-row">
        <input type="checkbox" id="soundEnabled" />
        <label for="soundEnabled">Play a sound when a frame is captured</label>
      </div>

      <div class="sound-info" id="soundInfo">
        <span class="dot"></span>
        Current sound: <span id="currentSound">default</span>
      </div>

      <div class="actions">
        <button id="testSound" type="button">▶ Test</button>
        <button id="chooseFile" type="button">Upload custom sound…</button>
        <button id="resetSound" type="button">Reset to default</button>
      </div>
      <input
        type="file"
        id="soundFile"
        accept="audio/mpeg,audio/wav,audio/ogg,audio/mp3,.mp3,.wav,.ogg"
        style="display: none"
      />

      <p class="hint">MP3, WAV, or OGG only, up to 500 KB.</p>

      <div id="status"></div>
    </fieldset>

    <script src="options.js"></script>
  </body>
</html>
